<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d18"><title>MAROYN — мессенджер</title>
<style>
:root{--bg:#090d18;--side:#101827;--card:#151f31;--card2:#1d2a40;--line:#26344b;--txt:#f5f7ff;--muted:#91a0b8;--accent:#7184ff;--accent2:#9b68f4;--green:#42d6a0;--shadow:0 24px 70px #0007}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#25366c 0,transparent 42%),var(--bg);color:var(--txt);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;color:inherit}.shell{height:100dvh;max-width:1250px;margin:auto;padding:16px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}
.sidebar,.main{background:#101827ed;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.sidebar{display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 17px}.logo{height:45px;width:45px;border-radius:16px;display:grid;place-items:center;font-size:21px;font-weight:900;background:linear-gradient(140deg,#6e82ff,#a15ff2);box-shadow:0 8px 26px #7184ff55}.brand b{font-size:21px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:3px}
.me{margin:0 14px 15px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:17px;display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;font-weight:800;flex:none;background:linear-gradient(135deg,#35cda3,#387fe8);color:white}.me input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font-weight:650}.sub{color:var(--muted);font-size:11px;margin-top:3px}
.searchbox{margin:0 14px 16px;position:relative}.searchbox input{width:100%;padding:12px 14px 12px 39px;background:#0b1220;border:1px solid var(--line);border-radius:13px;color:var(--txt);outline:none}.searchbox span{position:absolute;left:13px;top:10px;color:var(--muted)}
.label{padding:0 19px 9px;color:#7788a4;font-size:10px;letter-spacing:1.7px;font-weight:800}.chatlist{overflow:auto;padding:0 8px;flex:1}.chatitem{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:11px;text-align:left;padding:11px;border-radius:16px;margin-bottom:3px}.chatitem:hover,.chatitem.active{background:var(--card2)}.chatitem .avatar{border-radius:50%;width:45px;height:45px}.chatmeta{min-width:0;flex:1}.chatmeta strong{display:block;font-size:14px}.preview{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.chatright{color:var(--muted);font-size:10px;align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}.unread{background:var(--accent);color:white;border-radius:20px;padding:2px 7px;font-size:10px}
.sidefoot{padding:13px 14px;border-top:1px solid var(--line);display:flex;gap:8px}.soft{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}.sidefoot .soft{flex:1}
.main{display:flex;flex-direction:column;position:relative}.top{height:76px;padding:0 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex:none}.top .avatar{border-radius:50%}.topname{font-weight:750}.status{font-size:11px;color:var(--green);margin-top:4px}.grow{flex:1}.topactions{display:flex;gap:8px}.icon{width:39px;height:39px;border:1px solid var(--line);border-radius:13px;background:var(--card);font-size:16px}.messages{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}.datepill{align-self:center;color:#8291ab;background:#172238;padding:6px 12px;border-radius:20px;font-size:10px;margin-bottom:8px}.bubble{max-width:min(76%,520px);padding:11px 14px;background:#1d2a40;border:1px solid #2b3a54;border-radius:17px 17px 17px 5px;line-height:1.45;overflow-wrap:anywhere;position:relative}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#5369df,#795bd3);border:0;border-radius:17px 17px 5px 17px}.bubble .stamp{display:block;text-align:right;font-size:10px;color:#dce1ffad;margin-top:5px}.bubble img{max-width:230px;max-height:230px;border-radius:11px;display:block}.audio-row{display:flex;align-items:center;gap:8px;min-width:200px}.audio-row audio{width:210px;max-width:100%;height:34px}.filelink{color:white}.empty{margin:auto;text-align:center;color:var(--muted);max-width:300px}.empty .emoji{font-size:45px;margin-bottom:10px}.empty b{display:block;color:var(--txt);font-size:17px}.empty p{font-size:13px;line-height:1.6}
.typing{font-size:11px;color:var(--green);padding:0 24px 8px;min-height:18px}.composer{padding:13px 16px 15px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end}.compose-tools{display:flex;gap:7px}.composebtn{height:46px;width:46px;border:1px solid var(--line);border-radius:15px;background:var(--card);font-size:18px}.messageinput{flex:1;min-width:0;resize:none;max-height:120px;min-height:46px;padding:13px 15px;border-radius:15px;background:#0b1220;border:1px solid var(--line);color:var(--txt);outline:none}.send{height:46px;border:0;border-radius:15px;padding:0 19px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:750;box-shadow:0 7px 20px #7184ff30}.recording{background:#d94d68!important;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px #d94d6833}}
.mobileback{display:none}.modalbg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modalbg.show{display:flex}.modal{width:min(390px,100%);background:#121c2d;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 15px}.modal input{width:100%;padding:13px;background:#0b1220;border:1px solid var(--line);border-radius:12px;color:white;outline:none;margin:7px 0 14px}.modalactions{display:flex;justify-content:flex-end;gap:8px}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;border-radius:12px;padding:11px 16px;font-weight:700}.notice{font-size:11px;color:var(--muted);text-align:center;padding:0 12px 9px}
@media(max-width:720px){.shell{padding:0;display:block;height:100dvh}.sidebar,.main{border:0;border-radius:0;height:100dvh}.sidebar{display:flex}.main{display:none}.shell.chatopen .sidebar{display:none}.shell.chatopen .main{display:flex}.top{height:68px;padding:0 13px}.mobileback{display:inline-grid;place-items:center}.messages{padding:16px 13px}.bubble{max-width:87%}.composer{padding:10px 9px calc(10px + env(safe-area-inset-bottom));gap:6px}.composebtn{height:43px;width:42px}.send{height:43px;padding:0 13px}.messageinput{min-height:43px;padding:11px}.brand{padding-top:27px}.sidefoot{padding-bottom:calc(13px + env(safe-area-inset-bottom))}}
</style></head>
<body>
<div class="shell" id="shell">
<aside class="sidebar">
 <div class="brand"><div class="logo">M</div><div><b>MAROYN</b><small>CHAT • VOICE • MOMENTS</small></div></div>
 <div class="me"><div class="avatar" id="myAvatar">Я</div><div style="min-width:0;flex:1"><input id="myName" maxlength="24" value="Мой профиль"><div class="sub">Мой профиль</div></div><button class="icon" id="settings" title="О приложении">⚙</button></div>
 <div class="searchbox"><span>⌕</span><input id="search" placeholder="Поиск по чатам"></div>
 <div class="label">ВАШИ ЧАТЫ</div><div class="chatlist" id="chatlist"></div>
 <div class="sidefoot"><button class="soft" id="newChat">＋ Новый чат</button><button class="soft" id="clear">Очистить</button></div>
</aside>
<main class="main">
 <header class="top"><button class="icon mobileback" id="back">‹</button><div class="avatar" id="peerAvatar">M</div><div><div class="topname" id="peerName">MAROYN</div><div class="status" id="peerStatus">● Локальный чат</div></div><div class="grow"></div><div class="topactions"><button class="icon" id="info" title="Информация">ⓘ</button></div></header>
 <section class="messages" id="messages"></section><div class="typing" id="typing"></div>
 <footer class="composer"><div class="compose-tools"><button class="composebtn" id="attach" title="Отправить фото">＋</button><button class="composebtn" id="record" title="Голосовое">🎙</button></div><textarea class="messageinput" id="message" rows="1" placeholder="Сообщение…"></textarea><button class="send" id="send">➤</button><input type="file" id="file" accept="image/*" hidden></footer>
 <div class="notice">Локальная версия · сообщения хранятся на этом устройстве</div>
</main></div>
<div class="modalbg" id="modalbg"><div class="modal"><h2 id="modalTitle">Новый чат</h2><input id="modalInput" maxlength="30" placeholder="Имя собеседника"><div class="modalactions"><button class="soft" id="cancel">Отмена</button><button class="primary" id="confirm">Создать</button></div></div></div>
<script>
const $=id=>document.getElementById(id), shell=$('shell');
const colors=['linear-gradient(135deg,#35cda3,#387fe8)','linear-gradient(135deg,#ffad61,#f36c91)','linear-gradient(135deg,#8b71ff,#d36bdf)','linear-gradient(135deg,#35b9c9,#4b83ef)','linear-gradient(135deg,#e1a34b,#d85f5f)'];
let db={chats:[],active:null};
try{db=JSON.parse(localStorage.getItem('maroyn_v2')||'{"chats":[]}')}catch(e){db={chats:[]}}
if(!db.chats.length){let id='notes';db.chats=[{id,name:'Мои заметки',messages:[],color:0}];db.active=id}
db.active=db.chats.some(c=>c.id===db.active)?db.active:db.chats[0].id;
const meName=localStorage.getItem('maroyn_name_v2')||'Мой профиль';$('myName').value=meName;$('myAvatar').textContent=meName[0]||'Я';
function save(){try{localStorage.setItem('maroyn_v2',JSON.stringify(db))}catch(e){$('typing').textContent='Не хватает памяти браузера для сохранения. Удали часть старых фото/голосовых.'}}
function current(){return db.chats.find(c=>c.id===db.active)||db.chats[0]}
function initials(n){return (n||'?').trim().slice(0,1).toUpperCase()}
function renderList(){let q=$('search').value.toLowerCase();$('chatlist').innerHTML='';db.chats.filter(c=>c.name.toLowerCase().includes(q)).forEach(c=>{let el=document.createElement('button');el.className='chatitem'+(c.id===db.active?' active':'');let av=document.createElement('div');av.className='avatar';av.style.background=colors[c.color%colors.length];av.textContent=initials(c.name);let meta=document.createElement('div');meta.className='chatmeta';let name=document.createElement('strong');name.textContent=c.name;let prev=document.createElement('span');prev.className='preview';let last=c.messages.at(-1);prev.textContent=last?(last.type==='audio'?'🎤 Голосовое':last.type==='image'?'📷 Фото':last.text):'Начните общение';meta.append(name,prev);let right=document.createElement('div');right.className='chatright';right.textContent=last?.time||'';el.append(av,meta,right);el.onclick=()=>openChat(c.id);$('chatlist').append(el)})}
function openChat(id){db.active=id;save();render();shell.classList.add('chatopen')}
function render(){let c=current();$('peerName').textContent=c.name;$('peerAvatar').textContent=initials(c.name);$('peerAvatar').style.background=colors[c.color%colors.length];$('peerStatus').textContent='● Локальный чат';let box=$('messages');box.innerHTML='';let date=document.createElement('div');date.className='datepill';date.textContent='СЕГОДНЯ';box.append(date);if(!c.messages.length){let e=document.createElement('div');e.className='empty';e.innerHTML='<div class="emoji">✦</div><b>Ваш чат готов</b><p>Отправьте сообщение, фотографию или голосовое. Это приватное пространство на вашем устройстве.</p>';box.append(e)}c.messages.forEach(m=>{let b=document.createElement('div');b.className='bubble mine';if(m.type==='image'){let im=document.createElement('img');im.src=m.data;im.alt='Отправленное фото';b.append(im)}else if(m.type==='audio'){let row=document.createElement('div');row.className='audio-row';row.textContent='🎙 ';let a=document.createElement('audio');a.controls=true;a.src=m.data;row.append(a);b.append(row)}else b.textContent=m.text;let stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=m.time;b.append(stamp);box.append(b)});box.scrollTop=box.scrollHeight;renderList()}
function stamp(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function add(m){current().messages.push({...m,time:stamp()});save();render()}
function send(){let v=$('message').value.trim();if(!v)return;add({type:'text',text:v});$('message').value='';$('message').style.height='auto'}
$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('message').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('search').oninput=renderList;
$('myName').oninput=()=>{localStorage.setItem('maroyn_name_v2',$('myName').value);$('myAvatar').textContent=initials($('myName').value)};
$('newChat').onclick=()=>{$('modalTitle').textContent='Создать новый чат';$('modalInput').value='';$('modalbg').classList.add('show');$('modalInput').focus()};
$('cancel').onclick=()=>$('modalbg').classList.remove('show');$('confirm').onclick=()=>{let n=$('modalInput').value.trim();if(!n)return;let c={id:'c'+Date.now(),name:n,messages:[],color:db.chats.length%colors.length};db.chats.unshift(c);db.active=c.id;save();$('modalbg').classList.remove('show');render();shell.classList.add('chatopen')};
$('modalInput').onkeydown=e=>{if(e.key==='Enter')$('confirm').click()};
$('back').onclick=()=>shell.classList.remove('chatopen');
$('info').onclick=()=>alert('MAROYN v2\\nДемо-мессенджер с локальными чатами, фото и голосовыми. Чтобы переписываться с другими людьми через интернет, нужно подключить сервер и аккаунты.');
$('settings').onclick=()=>$('info').click();
$('clear').onclick=()=>{if(confirm('Удалить все чаты и сообщения с этого устройства?')){db={chats:[{id:'notes',name:'Мои заметки',messages:[],color:0}],active:'notes'};save();render()}};
$('attach').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Выбери изображение.');if(f.size>2*1024*1024)return alert('Для этой версии выбери фото до 2 МБ.');let r=new FileReader();r.onload=()=>add({type:'image',data:r.result});r.readAsDataURL(f);e.target.value=''};
let recorder=null,stream=null,chunks=[];
$('record').onclick=async()=>{let btn=$('record');if(recorder?.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('typing').textContent='Голосовые доступны в Chrome при открытии страницы через безопасное HTTPS-соединение.';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});let reader=new FileReader();reader.onload=()=>add({type:'audio',data:reader.result});reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop());btn.classList.remove('recording');btn.textContent='🎙';$('typing').textContent='Голосовое добавлено.'};recorder.start();btn.classList.add('recording');btn.textContent='■';$('typing').textContent='Запись… нажмите ■ для отправки.'}catch(e){$('typing').textContent='Разрешите доступ к микрофону в настройках Chrome.'}};
render();
</script></body></html>
